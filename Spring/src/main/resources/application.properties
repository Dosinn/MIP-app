spring.application.name=Projekty

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:university_db}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:this-is-a-local-dev-secret-key-change-in-production-projekty-2026}
jwt.expiration-ms=86400000

app.upload-dir=${UPLOAD_DIR:/app/uploads/projects}
app.google.client-id=${GOOGLE_CLIENT_ID:516425979009-77lsabevsqs8acugjt03e3p8krv4u1t2.apps.googleusercontent.com}
app.google.allowed-domains=${ALLOWED_DOMAINS:@stuba.sk,gmail.com}
app.cors.extra-origins=${CORS_ORIGINS:}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Set to WARN in production to reduce noise
logging.level.org.springframework.security=WARN
