spring.application.name=Projekty

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB:university_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:this-is-a-local-dev-secret-key-change-in-production-projekty-2026}
jwt.expiration-ms=86400000

app.university-email-domain=${UNIVERSITY_EMAIL_DOMAIN:@stuba.sk}
app.upload-dir=${UPLOAD_DIR:/app/uploads/projects}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

logging.level.org.springframework.security=DEBUG

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
