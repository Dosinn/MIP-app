server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;

    # Docker internal DNS resolver (prevents startup crashes when upstream containers are still booting)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Dynamic backend targets
    set $fastapi_backend http://fastapi:8000;
    set $spring_backend http://spring:8080;

    # Health check endpoint for Docker / Kamal-proxy
    location = /up {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # FastAPI NLP & Similarity microservice (порт 8000 в окремому контейнері fastapi)
    location ~ ^/(nlp|similarity|project)(/|$) {
        proxy_pass $fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Spring Boot REST API (порт 8080 в окремому контейнері spring)
    location ~ ^/(auth|categories|files|lessons|notifications|projects|reviews|sections|teams|invites|users|actuator)(/|$) {
        proxy_pass $spring_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Static Frontend (React PWA)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # PWA caching headers
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
