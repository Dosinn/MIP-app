server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ONCE & Kamal-proxy health check
    location = /up {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # FastAPI NLP & Similarity microservice (порт 8000 в окремому контейнері fastapi)
    # Зверніть увагу на (/|$), щоб /projects випадково не матчило /project
    location ~ ^/(nlp|similarity|project)(/|$) {
        proxy_pass http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Spring Boot REST API (прямо на http://spring:8080 без штучних /api префіксів)
    location ~ ^/(auth|categories|files|lessons|notifications|projects|sections|teams|invites|users|actuator)(/|$) {
        proxy_pass http://spring:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Static Frontend (React PWA)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # PWA caching headers
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
