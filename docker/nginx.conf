server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;

    # Gzip compression for fast mobile loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Docker internal DNS resolver (prevents startup crashes when upstream containers are still booting)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Dynamic backend targets
    set $fastapi_backend http://fastapi:8000;
    set $spring_backend http://spring:8080;

    # Proxy buffers to avoid 502 Bad Gateway on large responses/headers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Health check endpoint for Docker / Kamal-proxy
    location = /up {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # FastAPI NLP & Similarity microservice
    location ~ ^/(nlp|similarity|project)(/|$) {
        proxy_pass $fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Spring Boot REST API
    location ~ ^/(auth|categories|files|lessons|notifications|projects|reviews|sections|teams|invites|users|actuator)(/|$) {
        proxy_pass $spring_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # PWA service worker, manifest, and index.html must NEVER be cached
    location ~* (index\.html|sw\.js|manifest\.webmanifest)$ {
        root /var/www/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Static assets with content hash — return 404 if missing, never index.html
    location /assets/ {
        root /var/www/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA icons and images — return 404 if missing, never fall back to index.html
    location ~* \.(ico|png|svg|webp|jpg|jpeg)$ {
        root /var/www/html;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Static Frontend (React PWA)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
