services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - spring
      - fastapi

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/university_db}
      - MODEL_NAME=${MODEL_NAME:-kinit/slovakbert-sts-stsb}
      - SIMILARITY_K=${SIMILARITY_K:-5}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.48}
      - TITLE_WEIGHT=${TITLE_WEIGHT:-0.3}
      - DESC_WEIGHT=${DESC_WEIGHT:-0.7}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - once_storage:/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/project/health || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 5

  spring:
    build:
      context: .
      dockerfile: Dockerfile.spring
    expose:
      - "8080"
    environment:
      # Database
      - POSTGRES_DB=${POSTGRES_DB:-university_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-university_db}
      # Security
      - JWT_SECRET=${JWT_SECRET:-this-is-a-local-dev-secret-key-change-in-production-projekty-2026}
      # File uploads stored in persistent volume
      - UPLOAD_DIR=${UPLOAD_DIR:-/storage/uploads}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-516425979009-77lsabevsqs8acugjt03e3p8krv4u1t2.apps.googleusercontent.com}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-@stuba.sk,gmail.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - once_storage:/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-university_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-university_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  once_storage:
    name: mip_once_storage
  pgdata:
    name: mip_postgres_data
